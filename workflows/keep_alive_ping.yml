# =============================================================================
# SGE · CELINPB — GitHub Actions: Keep-Alive + Backup automático
# Arquivo: .github/workflows/keep_alive_ping.yml
# Repositório: o mesmo do frontend (GitHub Pages)
#
# O que este workflow faz:
#   1. A cada 5 dias, faz um "ping" no banco Supabase para evitar a pausa
#      automática do plano gratuito (que ocorre após 7 dias sem atividade).
#   2. Uma vez por semana (domingo às 03h), exporta todas as tabelas críticas
#      como JSON e salva como artefato no GitHub por 90 dias.
#
# CONFIGURAÇÃO NECESSÁRIA (uma única vez):
#   No seu repositório GitHub → Settings → Secrets and variables → Actions
#   Adicione os seguintes secrets:
#     SUPABASE_URL        → URL do seu projeto (ex: https://xxxx.supabase.co)
#     SUPABASE_ANON_KEY   → chave anon/public (NÃO a service_role key)
#     SUPABASE_SERVICE_KEY → service_role key (usada APENAS no backup server-side)
#
#   ATENÇÃO: SUPABASE_SERVICE_KEY nunca deve aparecer no frontend.
#   Aqui ela é usada apenas em ambiente de CI controlado (runner GitHub).
# =============================================================================

name: SGE · Keep-Alive e Backup

on:
  schedule:
    # Ping a cada 5 dias (dom, ter, sex às 04h UTC = 01h Brasília)
    - cron: '0 4 */5 * *'
    # Backup completo todo domingo às 03h UTC = 00h Brasília
    - cron: '0 3 * * 0'
  workflow_dispatch:  # permite rodar manualmente pelo painel do GitHub

jobs:
  # ===========================================================================
  # JOB 1 · PING — mantém o banco ativo
  # ===========================================================================
  ping:
    name: Ping no banco (keep-alive)
    runs-on: ubuntu-latest
    steps:
      - name: Fazer ping no Supabase
        run: |
          echo "Enviando ping para ${{ secrets.SUPABASE_URL }} ..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/semestres?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}")
          echo "HTTP status: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "AVISO: Resposta inesperada do Supabase (status $STATUS)."
            exit 1
          fi
          echo "Ping bem-sucedido. Banco ativo."

  # ===========================================================================
  # JOB 2 · BACKUP — exporta dados críticos como JSON
  # Roda apenas nos domingos (cron '0 3 * * 0') ou manualmente
  # ===========================================================================
  backup:
    name: Backup semanal do banco
    runs-on: ubuntu-latest
    # Só executa no domingo OU quando disparado manualmente
    if: github.event_name == 'workflow_dispatch' || contains(github.event.schedule, '0 3 * * 0')
    steps:
      - name: Criar pasta de backup
        run: mkdir -p backup

      - name: Exportar tabelas críticas
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SERVICE_KEY:  ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          # Função auxiliar: exporta uma tabela inteira como JSON
          export_table() {
            TABLE=$1
            echo "Exportando $TABLE ..."
            curl -s \
              "$SUPABASE_URL/rest/v1/$TABLE?select=*" \
              -H "apikey: $SERVICE_KEY" \
              -H "Authorization: Bearer $SERVICE_KEY" \
              -H "Prefer: count=exact" \
              > "backup/${TABLE}.json"
            COUNT=$(python3 -c "import json,sys; d=json.load(open('backup/${TABLE}.json')); print(len(d) if isinstance(d,list) else 'erro')")
            echo "  → $COUNT registros exportados"
          }

          # Tabelas prioritárias (dados que mais doem perder)
          export_table usuarios
          export_table alunos
          export_table semestres
          export_table turmas
          export_table matriculas
          export_table frequencias
          export_table notas
          export_table ocorrencias
          export_table auditoria
          export_table cursos
          export_table avaliacoes

          # alunos_sensiveis: exportada com service_role (tem acesso total)
          echo "Exportando alunos_sensiveis (dados LGPD) ..."
          curl -s \
            "$SUPABASE_URL/rest/v1/alunos_sensiveis?select=*" \
            -H "apikey: $SERVICE_KEY" \
            -H "Authorization: Bearer $SERVICE_KEY" \
            > "backup/alunos_sensiveis.json"
          echo "  → $(python3 -c "import json; d=json.load(open('backup/alunos_sensiveis.json')); print(len(d))")" registros

          echo "Backup completo em $(date -u '+%Y-%m-%d %H:%M UTC')"

      - name: Criar manifesto do backup
        run: |
          DATE=$(date -u '+%Y-%m-%dT%H:%M:%SZ')
          echo "{\"backup_em\": \"$DATE\", \"arquivos\": $(ls backup/*.json | python3 -c "import sys,json; print(json.dumps([l.strip() for l in sys.stdin]))")}" \
            > backup/manifesto.json
          cat backup/manifesto.json

      - name: Salvar backup como artefato GitHub
        uses: actions/upload-artifact@v4
        with:
          name: sge-backup-${{ github.run_id }}-${{ github.run_number }}
          path: backup/
          retention-days: 90
          # Artefatos ficam disponíveis por 90 dias na aba Actions do GitHub.
          # Para baixar: GitHub → Actions → último workflow → Artifacts → Download

      - name: Resumo do backup
        run: |
          echo "### Backup SGE · CELINPB" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Data: $(date -u '+%d/%m/%Y %H:%M UTC')" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Tabela | Tamanho |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|---------|" >> $GITHUB_STEP_SUMMARY
          for f in backup/*.json; do
            NAME=$(basename $f)
            SIZE=$(du -sh $f | cut -f1)
            echo "| $NAME | $SIZE |" >> $GITHUB_STEP_SUMMARY
          done
